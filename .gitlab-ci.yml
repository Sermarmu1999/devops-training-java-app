# EJERCICIO 1: Definición de stages (ci y cd)
stages:
  - ci
  - cd

# EJERCICIO 2: Definición de variables globales
variables:
  IMAGE_REPO: "devops-training-java-app"
  REGISTRY_HOST: "local-registry:5000"
  REGISTRY_REPO: "$REGISTRY_HOST/$IMAGE_REPO"
  COMPOSE_SERVICE: "app"

# EJERCICIO 1 y 2: Job mínimo para validar sintaxis e imprimir variables predefinidas
ci:info:
  stage: ci
  image: alpine:3.19
  script:
    - echo "=== Ejercicio 1 y 2: Validando variables predefinidas y globales (Java) ==="
    - echo "Rama actual (predefinida): $CI_COMMIT_BRANCH"
    - echo "Commit SHA (predefinida): $CI_COMMIT_SHA"
    - echo "Host del Registry (global): $REGISTRY_HOST"
    - echo "Ruta de Artifactory (global): $ARTIFACTORY_URL/$ARTIFACTORY_REPO"

# EJERCICIO 3: CI con contenedores (Docker como agente) - Ejecutar lint y test dentro de la imagen de herramientas CI
ci:tests:
  stage: ci
  image: docker:27 # Imagen base de Docker
  services:
    - docker:27-dind # Servicio Docker-in-Docker anidado
  variables:
    DOCKER_TLS_CERTDIR: "" 
    CI_TOOLS_IMAGE: "java-ci-tools:$CI_COMMIT_SHA"
  script:
    - echo "=== Ejercicio 3: Construyendo imagen Maven de CI ==="
    # Se construye la imagen basada en el Dockerfile de CI de Java
    - docker build -t $CI_TOOLS_IMAGE -f devops/ci.Dockerfile .
    
    - echo "=== Ejecutando validaciones dentro del contenedor ==="
    # Se ejecuta el linter y los tests mapeando el código fuente
    - docker run --rm -v $(pwd):/app -w /app $CI_TOOLS_IMAGE make lint
    - docker run --rm -v $(pwd):/app -w /app $CI_TOOLS_IMAGE make test

# EJERCICIO 4: Build de imagen Docker de la aplicación - Construir la imagen final (Dockerfile)
ci:build:
  stage: ci
  image: docker:27
  services:
    - docker:27-dind
  # Solo se ejecuta si los tests unitarios han terminado con éxito
  needs: 
    - ci:tests
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "=== Ejercicio 4: Iniciando construcción de la imagen Docker (Java) ==="
    # Se construye la imagen usando el Dockerfile de producción
    - docker build -t $IMAGE_REPO:$CI_COMMIT_SHA -f devops/Dockerfile .
    - echo "Imagen construida con éxito: $IMAGE_REPO:$CI_COMMIT_SHA"