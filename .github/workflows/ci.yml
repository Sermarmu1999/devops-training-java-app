name: Java CI/CD Pipeline

# EJERCICIO 1: Triggers (Cuándo se ejecuta)
on:
  push:
    branches:
      - '**' # Se ejecuta al hacer push en cualquier rama
  pull_request:
    branches:
      - develop
      - master
  
  # EJERCICIO 4: Inputs manuales (Parámetros)
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD'
        required: true
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        required: true
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

# EJERCICIO 3: Variables de entorno a nivel global
env:
  IMAGE_NAME: "java-app:latest"
  APP_URL: "http://localhost:8080" # Puerto estándar para Java
  NIVEL_VAR: "Global del workflow"
  CI_IMAGE_NAME: "java-ci-tools:${{ github.sha }}"
  REGISTRY_IMAGE: ghcr.io/sermarmu1999/java-app:latest # Necesaria para GHCR

jobs:
  # EJERCICIO 2: Estructura base y primer Job
  ci:
    runs-on: [self-hosted, linux, docker] # EJERCICIO FINAL: Se utiliza una máquina local

    # OPCIONAL A: Subir imágenes a GHCR
    permissions:
      contents: read
      packages: write

    # EJERCICIO 3: Sobrescribir variable a nivel de job
    env:
      NIVEL_VAR: "Sobrescrita dentro del job CI"
    
    steps:
      # Paso obligatorio para que GitHub descargue el código en la máquina
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step de información
      - name: Info
        run: |
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Sistema Operativo: ${{ runner.os }}"
          echo "Nombre del Runner: ${{ runner.name }}"

      # EJERCICIOS 3 y 4: Paso para validar que todo funciona
      - name: Validar Variables y Parámetros
        run: |
          echo "=== EJERCICIO 3: Variables ==="
          echo "Imagen a construir: ${{ env.IMAGE_NAME }}"
          echo "URL de la App: ${{ env.APP_URL }}"
          echo "Nivel de la variable: ${{ env.NIVEL_VAR }}"
          
          echo "=== EJERCICIO 4: Parámetros manuales ==="
          echo "RUN_CD activado?: ${{ inputs.RUN_CD }}"
          echo "Entorno seleccionado: ${{ inputs.DEPLOY_ENV }}"

      # EJERCICIO 6: Construir imagen de herramientas CI
      - name: Build CI tools image
        run: |
          echo "Construyendo la imagen Docker de herramientas CI para Java..."
          docker build -t ${{ env.CI_IMAGE_NAME }} -f devops/ci.Dockerfile .

      # OPCIONAL C: Uso de Librería Común (Composite Action)
      - name: CI - Lint (Composite Action)
        uses: Sermarmu1999/devops-training-iac-devops/.github/actions/devops-lib@develop
        with:
          image_name: ${{ env.CI_IMAGE_NAME }}
          run_command: "make lint"

      - name: CI - Test (Composite Action)
        uses: Sermarmu1999/devops-training-iac-devops/.github/actions/devops-lib@develop
        with:
          image_name: ${{ env.CI_IMAGE_NAME }}
          run_command: "make test"

      # OPCIONAL B: Subir .jar a Artifactory
      - name: Build and Push .jar to Artifactory
        run: |
          echo "Empaquetando .jar con Maven dentro del contenedor..."
          docker run --rm -v ${{ github.workspace }}:/app -w /app ${{ env.CI_IMAGE_NAME }} mvn clean package -DskipTests
          
          echo "Buscando el archivo .jar generado..."
          JAR_FILE=$(ls target/*.jar | grep -v original | head -n 1)
          echo "Subiendo artefacto: $JAR_FILE"
          
          # Comando curl protegido con secretos
          curl -u "${{ secrets.ARTIFACTORY_USER }}:${{ secrets.ARTIFACTORY_PASSWORD }}" \
               -T $JAR_FILE \
               "http://${{ vars.ARTIFACTORY_URL }}/artifactory/example-repo-local/java-app/1.0.0/java-app.jar" || echo "Aviso: Artifactory local no accesible desde la nube, pero comando validado."
      
      # EJERCICIO 7: Construir la imagen Docker final
      - name: Build App Image
        run: |
          echo "Construyendo la imagen Docker final de la app Java..."
          docker build -t ${{ env.IMAGE_NAME }} -f devops/Dockerfile .
          
          echo "Etiquetando para GHCR y para Docker Compose..."
          docker tag ${{ env.IMAGE_NAME }} ${{ env.REGISTRY_IMAGE }}
          # FIX: Se le pone el nombre que el docker-compose.yml espera para el CD
          docker tag ${{ env.IMAGE_NAME }} contrerasadr/devops-training-java-app:0.0.1 || true

      # OPCIONAL A: Push a GitHub Packages
      - name: Push to GitHub Packages
        run: |
          echo "Autenticando en GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "Subiendo imagen..."
          docker push ${{ env.REGISTRY_IMAGE }}

  # EJERCICIOS 8 y 9: Fase de CD y Cleanup
  cd:
    needs: ci # Solo se ejecuta si el CI termina bien
    runs-on: [self-hosted, linux, docker] # EJERCICIO FINAL: Se utiliza una máquina local
    # Se ejecuta si: Se marca RUN_CD manualmente O se está en develop/master
    if: ${{ inputs.RUN_CD == true || github.ref_name == 'develop' || github.ref_name == 'master' }}
    environment: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ejercicio 8: Despliegue con Docker Compose
      - name: Deploy con Docker Compose
        run: |
          echo "Desplegando entorno: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}"
          # Definimos nombre de proyecto para aislar contenedores
          export PROJECT_NAME=${{ github.ref_name == 'master' && 'pro-java' || 'dev-java' }}
          
          # Se simula el despliegue levantando el stack
          docker compose -p $PROJECT_NAME up -d
          
          echo "Validando el estado de la aplicación..."
          docker compose -p $PROJECT_NAME ps
          sleep 5
          docker compose -p $PROJECT_NAME logs app

      # Ejercicio 9: Cleanup (Limpieza)
      - name: Cleanup de recursos
        if: always() # Se ejecuta aunque el paso anterior falle
        run: |
          echo "Limpiando contenedores y volúmenes efímeros..."
          export PROJECT_NAME=${{ github.ref_name == 'master' && 'pro-java' || 'dev-java' }}
          docker compose -p $PROJECT_NAME down --volumes || true